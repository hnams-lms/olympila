<style>

.btn.primary{background:linear-gradient(135deg,#2563A8,#1A4A7A);color:#fff;border-color:transparent}.btn.green{background:var(--green);color:#fff;border-color:transparent}.btn.red{background:var(--rose);color:#fff;border-color:transparent}.btn.gold{background:var(--gold);color:#3a2a00;border-color:transparent}

.ans{margin:16px auto;max-width:700px;background:rgba(30,138,90,.2);border:2px solid var(--green);border-radius:14px;padding:14px;font-size:22px;font-weight:800}
.vrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}.vi{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700}.vi.ok{background:var(--green)}.vi.no{background:var(--rose)}
.msg{margin-top:12px;font-size:17px;font-weight:700;color:var(--gold)}.wait{font-size:22px;opacity:.7;padding:70px 0;font-weight:600}
.buz{display:inline-block;background:var(--rose);padding:8px 22px;border-radius:99px;font-weight:800;font-size:18px;margin:8px}
.panel{margin:14px 18px 30px;background:#fff;color:var(--ink);border-radius:18px;padding:18px}
.big{width:100%;font-size:22px;font-weight:700;padding:14px;text-align:center}
.bell{width:170px;height:170px;border-radius:50%;font-size:22px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#ff7b8f,#c0263d 70%);box-shadow:0 10px 30px rgba(192,38,61,.5),inset 0 -8px 16px rgba(0,0,0,.25);margin:8px auto;display:block;transition:.1s}.bell:active{transform:scale(.94)}.bell:disabled{filter:grayscale(1);opacity:.4;box-shadow:none}.bell.cnv{background:radial-gradient(circle at 35% 30%,#ffd56b,#c47a1a 70%);width:110px;height:110px;font-size:14px}

.sbd{padding:10px 18px}.pc{padding:6px 12px}.pc .s{font-size:26px}

.panel.mcp{position:sticky;bottom:0;margin:14px 0 0;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.55);max-height:60vh;overflow:auto;z-index:20;background:#F4F7FB}

.callout{background:#FEF3E2;border:2px solid var(--amber);border-radius:14px;padding:12px 16px;margin-top:10px;font-size:15px}.callout .deck{margin-top:8px}
.keyb{font-size:15px;margin:6px 0}

  sl.forEach((s,j)=>{const it=(s.v===20?(pool.p20||[])[u20++]:(pool.p30||[])[u30++])||{q:'(hết câu hỏi trong gói)',a:''};up[`gsteps/${G}/${nx}`]={r:'vd',mode:'vd',owner:p,q:it.q,ch:it.ch||null,type:it.ch?'mc':'text',pts:s.v,dur:s.v===20?15:20,star:!!s.star,label:`Về đích · ${pname(p)} · Câu ${j+1}/3 · ${s.v} điểm${s.star?' ⭐ Ngôi sao hy vọng':''}`};up[`gkeys/${G}/${nx}`]={a:it.a};ids.push(nx++)});
  await ROOT.update(up);goto(ids[0],{'vd/stage':'play','vd/slots':ids,'vd/u20':u20,'vd/u30':u30,'vd/next':nx})},
 vdNext(){const c=live.vd.cur+1;if(c>=4)return U(Object.assign({finished:true},fx('win')));goto(IDX.tt+3,{'vd/cur':c,'vd/stage':'pick','vd/slots':null})},
 music(k){U(fx(k))},
 adj(){const p=+$('#adp').value,v=+$('#adv').value;if(v)addSc({[P(p)]:v}).then(()=>toast('Đã cộng/trừ điểm'))}};
const MB=(t,f,c,d,sub)=>`<button class="mb ${c||''}" ${d?'disabled':''} onclick="${f}">${t}${sub?`<small>${sub}</small>`:''}</button>`;
function mcPanel(){const pnl=$('#pnl');if(!pnl||game.status!=='active')return;const m=step&&step.mode;let h='';window.MAIN=null;window.JY=null;window.JN=null;
 const chip=(t,on)=>`<span class="chip ${on?'on':''}">${t}</span>`;
 h+=`<div class="mhd"><h3>🎛 Điều khiển MC</h3><div class="grow"></div>${step?chip('Đã hiện câu',live.shown)+chip('Đang tính giờ',live.timer&&tleft()>0)+chip('Đã công bố',live.revealed):''}<span class="muted small">Bước ${live.idx+1}/${game.total||0}${live.vd?' + Về đích':''}</span></div>`;
 if(live.finished){h+=`<div class="deck">${MB('🏆 Phát nhạc chiến thắng','mc.music("win")','y')}${MB('Đánh dấu cuộc chơi kết thúc',`setSt('${G}','ended')`,'r')}</div>`}
 else if(live.vd&&live.vd.stage==='pick'){const p=live.vd.order[live.vd.cur],pk=live.vd.picks&&live.vd.picks[P(p)];h+=`<div class="mlab">Về đích · lượt ${esc(pname(p))}</div><div class="muted small">${pk?'Gói đã chọn: '+pk.s.map(x=>x.v+(x.star?'⭐':'')).join(' · '):'Đang chờ thí sinh chọn gói (nếu bỏ qua sẽ dùng gói mặc định 20-20-30⭐)'}</div><div class="deck">${MB('▶ BẮT ĐẦU LƯỢT CỦA THÍ SINH','mc.confirmVD()','g xl')}</div>`;window.MAIN=()=>mc.confirmVD()}
 else if(live.idx<0){h+=`<div class="deck">${MB('▶ BẮT ĐẦU CHƯƠNG TRÌNH','goto(0)','g xl',false,'Khởi động · Lượt riêng · Thí sinh 1')}${MB('🎵 Nhạc mở đầu','mc.music("intro")','y')}</div>`;window.MAIN=()=>goto(0)}
 else if(step){h+=`<div class="mlab">${esc(step.label)}</div>`;
  if(key&&m!=='vcnv_obs')h+=`<div class="keyb">Đáp án: ${esc(String(key.a).split('|').join('  /  '))}</div>`;
  if(step.r==='vcnv'){const v=live.vcnv||{},att=n=>v.attempted&&v.attempted['n'+n],cnt=Object.keys(v.attempted||{}).length;
   if(live.bell)h+=`<div class="callout">🔔 <b>${esc(pname(live.bell))}</b> bấm chuông CHƯỚNG NGẠI VẬT — đáp án: <b>${esc(String(obsKey.a))}</b><div class="deck">${MB('✔ ĐÚNG',"mc.obsV(true)",'g',false,'+'+mc.obsPts()+' điểm')}${MB('✘ SAI — loại',"mc.obsV(false)",'r')}</div></div>`;
   h+=`<div class="muted small mt">Lượt chọn hàng ngang: <b>Thí sinh ${(cnt%4)+1}</b> · đã chọn ${cnt}/4 · Đáp án CNV: <b>${esc(String(obsKey&&obsKey.a))}</b></div><div class="deck">${[1,2,3,4].map(n=>MB('Hàng ngang '+n,`mc.pickHW(${n})`,'b',!!att(n))).join('')}${MB('★ Ô trung tâm','mc.pickC()','y',cnt<4||!!v.centerShown)}${MB('Hiện đáp án CNV','mc.revealObs()','',!!v.solved)}${MB('Sang Tăng tốc ▶','goto(IDX.tt)','g')}</div>`}
  if(TYPED.has(m)&&live.shown){const st=!live.timer&&!live.revealed?1:!live.revealed?2:!live.applied?3:4;
   const mains=[null,['⏱ BẮT ĐẦU TÍNH GIỜ','mc.timer()','y'],['✔ CÔNG BỐ ĐÁP ÁN','mc.reveal()','g'],['💾 CHỐT ĐIỂM','mc.apply()','g'],step.r==='vcnv'?['↩ CHỌN HÀNG NGANG TIẾP','goto(IDX.hw)','b']:['▶ CÂU TIẾP THEO','mc.next()','b']][st];
   h+=`<div class="deck">${MB(mains[0],mains[1],mains[2]+' xl')}${MB('⏹ Dừng giờ','mc.stop()','',!live.timer)}</div>`;window.MAIN=()=>eval(mains[1]);
   if(live.revealed&&!live.applied){const ver=live.verdicts||{};h+=`<table class="mt"><tr><th>Thí sinh</th><th>Đáp án đã gửi</th><th>Thời gian</th><th>Chấm</th></tr>${Object.keys(ver).map(p=>{const n=+p.slice(1),s=subs[p]||{};return `<tr><td><b>${esc(pname(n))}</b></td><td>${esc((live.reveal.ans||{})[p]||'')}</td><td>${s.t&&live.timer?((s.t-live.timer.start)/1000).toFixed(2)+'s':''}</td><td><button class="btn ${ver[p].ok?'green':''}" onclick="mc.setV(${n},true)">Đúng</button> <button class="btn ${!ver[p].ok?'red':''}" onclick="mc.setV(${n},false)">Sai</button></td></tr>`}).join('')||'<tr><td colspan=4 class="muted">Không có thí sinh nào trả lời</td></tr>'}</table>`}
   else if(!live.revealed&&Object.keys(subs).length)h+=`<div class="muted small mt">Đã nhận: ${Object.keys(subs).map(p=>pname(+p.slice(1))+' '+(subs[p].sent?'✔':'…')).join(' · ')}</div>`}
  else if((m==='solo'||m==='buzz')){
   if(!live.shown){h+=`<div class="deck">${MB('👁 HIỆN CÂU HỎI','mc.show()','b xl',false,'Tự động tính giờ · '+step.dur+' giây sau khi đọc xong')}</div>`;window.MAIN=()=>mc.show()}
   else if(!live.applied){const w=m==='solo'?step.owner:live.buzzWinner;
    if(w){h+=`<div class="callout">🎤 <b>${esc(pname(w))}</b> đang trả lời (miệng) — MC chấm ngay:</div><div class="deck">${MB('✔ ĐÚNG','mc.judge(true)','g xl',false,'+10 điểm · phím Y')}${MB('✘ SAI','mc.judge(false)','r xl',false,m==='buzz'?'−5 điểm · phím N':'phím N')}</div>`;window.JY=()=>mc.judge(true);window.JN=()=>mc.judge(false)}
    else h+=`<div class="callout">⏳ Chờ thí sinh bấm chuông…</div><div class="deck">${MB('⏭ Không ai bấm — bỏ qua','mc.next()','',false)}</div>`;
    h+=`<div class="deck">${MB('👁 Hiện đáp án','mc.showAns()','y',!!live.revealed)}${MB('🔁 Tính giờ lại','mc.timer()','',false)}${MB('⏹ Dừng giờ','mc.stop()','',!live.timer)}</div>`}
   else{h+=`<div class="deck">${MB('▶ CÂU TIẾP THEO','mc.next()','b xl',false,'phím Cách')}</div>`;window.MAIN=()=>mc.next()}}
  else if(m==='vd'){
   if(!live.shown){h+=`<div class="deck">${MB('👁 HIỆN CÂU HỎI','mc.show()','b xl',false,'Tự động tính giờ '+step.dur+' giây'+(step.star?' · ⭐ Ngôi sao hy vọng':''))}</div>`;window.MAIN=()=>mc.show()}
   else if(live.applied){h+=`<div class="deck">${MB('▶ CÂU TIẾP THEO','mc.next()','b xl')}</div>`;window.MAIN=()=>mc.next()}
   else if(!live.vdOwnerDone){h+=`<div class="callout">🎤 <b>${esc(pname(step.owner))}</b> trả lời (miệng)${step.star?' · ⭐ SAO HY VỌNG (đúng ×2, sai −'+step.pts+')':''}</div><div class="deck">${MB('✔ ĐÚNG','mc.vdOwner(true)','g xl',false,'+'+step.pts*(step.star?2:1)+' điểm')}${MB('✘ SAI','mc.vdOwner(false)','r xl',false,step.star?'−'+step.pts+' điểm':'')}</div>`;window.JY=()=>mc.vdOwner(true);window.JN=()=>mc.vdOwner(false)}
   else if(!live.stealOpen){h+=`<div class="deck">${MB('🔔 MỞ CƯỚP QUYỀN (5 giây)','mc.steal()','y xl')}${MB('Không ai cướp — hiện đáp án','mc.noSteal()','')}</div>`;window.MAIN=()=>mc.steal()}
   else if(live.buzzWinner){h+=`<div class="callout">🔔 <b>${esc(pname(live.buzzWinner))}</b> cướp quyền — chấm:</div><div class="deck">${MB('✔ ĐÚNG','mc.vdSteal(true)','g xl',false,'+'+step.pts)}${MB('✘ SAI','mc.vdSteal(false)','r xl',false,'−'+step.pts/2)}</div>`;window.JY=()=>mc.vdSteal(true);window.JN=()=>mc.vdSteal(false)}
   else h+=`<div class="callout">⏳ Đang chờ thí sinh bấm chuông cướp quyền…</div><div class="deck">${MB('Không ai cướp — hiện đáp án','mc.noSteal()','')}</div>`;
   h+=`<div class="deck">${MB('👁 Hiện đáp án','mc.showAns()','y',!!live.revealed)}${MB('⏹ Dừng giờ','mc.stop()','',!live.timer)}</div>`}
  else if(TYPED.has(m)&&!live.shown&&step.r!=='vcnv'){h+=`<div class="deck">${MB('👁 HIỆN CÂU HỎI','mc.show()','b xl',false,'Sau đó bấm "Bắt đầu tính giờ"')}</div>`;window.MAIN=()=>mc.show()}
  h+=`<div class="deck sm">${MB('◀ Câu trước','mc.prev()','',live.idx<1||!!live.vd||(live.idx>=IDX.hw&&live.idx<IDX.tt))}${step.r!=='vcnv'?MB(live.idx===IDX.tt+3&&!live.vd?'Sang Về đích ▶':'Bỏ qua / Tiếp ▶','mc.next()','',false):''}</div>`}
 h+=`<div class="deck sm"><span class="small muted" style="grid-column:1/-1">🎵 Âm thanh & nhạc nền</span>${MB('🎬 Nhạc mở đầu','mc.music("intro")','')}${MB('🎼 Nhạc suy nghĩ','mc.music("think")','')}${MB('⏹ Tắt nhạc','mc.music("stop")','')}${MB('🏆 Nhạc chiến thắng','mc.music("win")','')}${MB('✔ Chuông đúng','mc.music("ok")','')}${MB('✘ Chuông sai','mc.music("no")','')}</div>`;
 h+=`<div class="row wrap" style="border-top:1px solid var(--line);padding-top:12px;margin-top:12px"><span class="small muted">Cộng/trừ điểm thủ công:</span><select id="adp" style="width:auto">${[1,2,3,4].map(i=>`<option value="${i}">${i}. ${esc(pname(i))}</option>`).join('')}</select><input id="adv" type="number" placeholder="±điểm" style="width:100px"><button class="btn" onclick="mc.adj()">Áp dụng</button><span class="small muted">Phím tắt: Cách = bước chính · Y = Đúng · N = Sai</span></div>`;
 const kv=document.activeElement&&document.activeElement.id==='adv'?$('#adv').value:'';pnl.innerHTML=h;if(kv){$('#adv').value=kv;$('#adv').focus()}}
document.addEventListener('keydown',e=>{if(ROLE!=='mc'||/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName))return;if(e.key===' '&&window.MAIN){e.preventDefault();window.MAIN()}else if((e.key==='y'||e.key==='Y')&&window.JY)window.JY();else if((e.key==='n'||e.key==='N')&&window.JN)window.JN()});
